name: Mobile check

# Analyzer and tests of the mobile app, on pull requests and on main, when something the app is
# built from changes.

on:
  push:
    branches: [main]
    paths: &paths
      - apps/mobile/**
      - .mise/tasks/mobile/**
      - mise.toml
      - .github/workflows/mobile-check.yml
  pull_request:
    paths: *paths

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Only Flutter is installed (mise-action's install_args); without this, `mise run` would install
  # the rest of mise.toml before the task.
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: flutter
      - run: mise run mobile:check
