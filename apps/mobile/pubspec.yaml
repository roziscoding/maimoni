name: maimoni
description: "maimoni mobile client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  passkeys: ^2.24.2
  shared_preferences: ^2.5.6
  sign_in_with_apple: ^8.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Icon and splash come from the web's icon (apps/frontend/public). After changing anything in
# assets/branding, regenerate with `mise run mobile:branding`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  adaptive_icon_monochrome: assets/branding/icon-foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/branding/splash.png
  android_12:
    color: "#000000"
    image: assets/branding/splash-android12.png
